name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # 零依赖项目没有 go.sum，默认的缓存键找不到文件，
          # 每次都会报 "Dependencies file is not found" 并跳过缓存。
          cache-dependency-path: go.mod

      - name: 格式检查
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 测试
        # 只有 Windows 上跑得到真实断言；另两个平台上注册表、进程枚举这些
        # 包会自己跳过，跑一遍是为了确保那些空实现真的能编译。
        run: go test ./... -v

  cross-build:
    name: 交叉编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go.mod

      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # 单二进制、零依赖是本项目的卖点，绝不能引入 cgo。
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/wintuner
